function __moveInArray(arr, fromIdx, toIdx){
  if(!Array.isArray(arr)) return;
  const n = arr.length;
  if(fromIdx<0 || fromIdx>=n || toIdx<0 || toIdx>=n || fromIdx===toIdx) return;
  const [it] = arr.splice(fromIdx, 1);
  arr.splice(toIdx, 0, it);
}

function handleReorderDrop(ev, listType, pid, targetIdx, tabId){
  ev.preventDefault();
  ev.stopPropagation();

  const raw = ev.dataTransfer.getData('application/json');
  if(!raw) return;
  let data;
  try{ data = JSON.parse(raw); }catch(e){ return; }
  if(!data || data.source !== 'main' || !data.reorder) return;

  const fromIdx = data.reorder.idx;
  const fromPage = data.reorder.page;
  const fromPid = data.reorder.pid;
  const fromTab = data.reorder.tabId || '';

  // Home subjects reorder
  if(listType==='home'){
    if(data.type !== 'subject' || fromPage !== 'home') return;
    const arr = DATA.home.subjects || [];
    __moveInArray(arr, fromIdx, targetIdx);
    saveData();
    renderHome();
    renderDailySidebar();
    return;
  }

  // Detail cards reorder
  if(listType==='detail'){
    if(data.type !== 'detail' || fromPage !== 'detail') return;
    if(String(fromPid) !== String(pid)) return;
    const arr = DATA.details?.[pid]?.cards || [];
    __moveInArray(arr, fromIdx, targetIdx);
    saveData();
    renderDetail(pid);
    renderDailySidebar();
    return;
  }

  // Module questions reorder (active tab only)
  if(listType==='module'){
    if(data.type !== 'question' || fromPage !== 'module') return;
    if(String(data.pid) !== String(pid)) return;
    const mod = DATA.modules?.[pid];
    if(!mod) return;
    const active = tabId || mod.activeTab || (mod.tabs[0] && mod.tabs[0].id);
    if(String(fromTab) !== String(active)) return;
    const tab = mod.tabs.find(t=>t.id===active) || mod.tabs[0];
    const arr = tab.questions || [];
    __moveInArray(arr, fromIdx, targetIdx);
    saveData();
    renderModule(pid);
    renderDailySidebar();
    return;
  }
}




function dropOnCard(ev, date, targetSlotIdx, targetCardIdx){
  ev.preventDefault();
  ev.stopPropagation();
  if(timelineAdding) return;

  const slotEl = ev.currentTarget.closest('.time-slot');
  if(slotEl) slotEl.classList.remove('drag-over');

  const raw = ev.dataTransfer.getData("application/json");
  if(!raw) return;

  let data;
  try { data = JSON.parse(raw); } catch(e){ return; }

  // sidebar -> sidebar: same-slot reorder + slot move (insert)
  if(data.source === 'sidebar'){
    const daily = DATA.dailyHistory?.[date];
    if(!daily) return;

    const fromSlotIdx = data.sIdx;
    const fromCardIdx = data.cIdx;

    if(fromSlotIdx === targetSlotIdx && fromCardIdx === targetCardIdx) return;

    const fromSlot = daily.slots?.[fromSlotIdx];
    const toSlot   = daily.slots?.[targetSlotIdx];
    if(!fromSlot || !toSlot) return;
    if(data.date && data.date !== date) return;
    const candidate = fromSlot.cardIds[fromCardIdx];
    if(fromSlot !== toSlot && candidate && candidate.type !== 'adhoc' && toSlot.cardIds.some(ref=>timerRefMatches(ref,candidate))) return;

    const [item] = fromSlot.cardIds.splice(fromCardIdx, 1);
    if(!item) return;
    if(fromSlot !== toSlot) placePlannedCard(toSlot,item);

    let insertIdx = targetCardIdx;
    if(fromSlotIdx === targetSlotIdx && fromCardIdx < targetCardIdx) insertIdx -= 1;

    toSlot.cardIds.splice(Math.max(0, insertIdx), 0, item);

    saveData();
    renderDailySidebar();
    return;
  }

  // main -> sidebar: insert before target card
  if(data.source === 'main'){
    const ref = {
      type: data.type, id: data.id, pid: data.pid,
      time:0, isRunning:false, done:false,
      originStr: data.originStr || ''
    };

    const daily = ensureDailyData(date);
    const slot = daily.slots?.[targetSlotIdx];
    if(!slot) return;

    // 중복 방지 (adhoc 제외)
    if(ref.type !== 'adhoc' && slot.cardIds.some(x => x.type===ref.type && x.id===ref.id)) return;

    placePlannedCard(slot,ref);
    slot.cardIds.splice(Math.max(0, targetCardIdx), 0, ref);

    saveData();
    renderDailySidebar();
  }
}

function dropOnSlot(ev, date, sIdx) {
  ev.preventDefault();
  ev.stopPropagation();
  if(timelineAdding) return;
  if(ev.currentTarget && ev.currentTarget.classList) ev.currentTarget.classList.remove('drag-over');

  try {
    const raw = ev.dataTransfer.getData("application/json");
    if(!raw) return;
    const data = JSON.parse(raw);

    if(data.source === 'slot') {
      const daily = DATA.dailyHistory?.[date];
      if(!daily || !Array.isArray(daily.slots)) return;

      const fromIdx = Number(data.sIdx);
      const toIdx = Number(sIdx);
      if(Number.isNaN(fromIdx) || Number.isNaN(toIdx) || fromIdx === toIdx) return;

      const [moved] = daily.slots.splice(fromIdx, 1);
      if(!moved) return;
      daily.slots.splice(toIdx, 0, moved);

      saveData();
      renderDailySidebar();
    } else if(data.source === 'sidebar') {
      const daily = DATA.dailyHistory?.[date];
      if(!daily) return;
      const srcSlot = daily.slots?.[data.sIdx];
      const dstSlot = daily.slots?.[sIdx];
      if(!srcSlot || !dstSlot) return;

      const item = srcSlot.cardIds.splice(data.cIdx, 1)[0];
      if(!item) return;

      dstSlot.cardIds.push(item);
      saveData();
      renderDailySidebar();
    } else if(data.source === 'main') {
      addToSlot(date, sIdx, {
        type: data.type, id: data.id, pid: data.pid,
        time:0, isRunning:false, done:false,
        originStr: data.originStr || ''
      });
    }
  } catch(e){}
}

/* =========================
   NAV (PATCHED: origin-aware + safe)
========================= */
function navigateToCard(type, id, pid, originStr) {
  // Always navigate to the actual card location.
  // originStr is kept only for optional back actions.
  try { window.__lastOrigin = originStr ? JSON.parse(originStr) : null; } catch(e){ window.__lastOrigin = null; }

  // Helper: find missing pid by scanning data
  function findModuleByTab(tabId){
    for(const [mid, mod] of Object.entries(DATA.modules||{})){
      if((mod.tabs||[]).some(t=>t.id===tabId)) return mid;
    }
    return null;
  }
  function findModuleByQuestion(qid){
    for(const [mid, mod] of Object.entries(DATA.modules||{})){
      for(const t of (mod.tabs||[])){
        if((t.questions||[]).some(q=>q.id===qid)) return mid;
      }
    }
    return null;
  }
  function findDetailPidByCardId(cardId){
    for(const [sid, det] of Object.entries(DATA.details||{})){
      if((det.cards||[]).some(c=>c.id===cardId)) return sid;
    }
    return null;
  }

  if(type === 'subject') {
    location.hash = `#/detail/${id}`;
    return;
  }

  if(type === 'detail'){
    const resolvedPid = pid || findDetailPidByCardId(id);
    const cardIndex = (DATA.details?.[resolvedPid]?.cards || []).findIndex(card=>card.id===id);
    if(cardIndex >= 0) onDetailCardClick(null, resolvedPid, cardIndex);
    return;
  }

  if(type === 'theory' || type === 'question'){
    const resolvedPid = pid || (type === 'theory' ? findModuleByTab(id) : findModuleByQuestion(id));
    const mod = DATA.modules?.[resolvedPid];
    const tab = (mod?.tabs || []).find(t=>type === 'theory' ? t.id===id : (t.questions || []).some(q=>q.id===id));
    if(!tab) return;
    mod.activeTab = tab.id;
    if(type === 'question') MODULE_QSRC_FILTER[`${resolvedPid}:${tab.id}`] = 'all';
    saveData();
    const targetHash = buildCardHash(type, id, resolvedPid);
    // Manual tab changes leave the URL intact, so a repeated target still needs rendering.
    if(location.hash === targetHash) renderModule(resolvedPid);
    else location.hash = targetHash;
    return;
  }
}

  return `

      <div class="sb-card-head" onclick="sbCardClick(event, '${jsAttr(ref.type)}', '${jsAttr(ref.id)}', '${jsAttr(ref.pid)}', '${jsAttr(ref.originStr||'')}')">
        <span class="sb-drag-handle"
          draggable="true"
          ondragstart="handleSidebarDragStart(event, ${sIdx}, ${cIdx})"
          onpointerdown="event.stopPropagation()"
          onmousedown="event.stopPropagation()"
          title="드래그로 이동">⋮⋮</span>

        <button class="clip-btn sb-clip" title="[카드 제목](링크) 복사"
          onpointerdown="event.stopPropagation()"
          onmousedown="event.stopPropagation()"
          onclick="event.stopPropagation(); copyCardMdLink('${jsAttr(info.title)}', '${jsAttr(buildCardHash(ref.type, ref.id, ref.pid, ref.originStr||''))}');">📋</button>

        <button class="btn btn-icon sb-btn-del"
          onpointerdown="event.stopPropagation()"
          onmousedown="event.stopPropagation()"
          onclick="event.stopPropagation(); removeDailyCard(event,'${date}',${sIdx},${cIdx})">×</button>

        <button class="btn btn-icon sb-btn-exp"

          onpointerdown="event.stopPropagation()"
          onmousedown="event.stopPropagation()"
          onclick="event.stopPropagation(); toggleSidebarExpand('${date}', ${sIdx}, ${cIdx})">
          ${ref.expanded ? '▲' : '▼'}
        </button>

        <span class="sb-title" title="${escapeHtml(info.title)}" ${titleAttr}>${titleExtra}${escapeHtml(info.title)}</span>

        <span class="sb-time" id="sb-time-${date}-${sIdx}-${cIdx}" title="Today / Total">
          ${formatTime(ref.time||0)}<br><span style="color:var(--text-sub);font-size:0.7rem;">${info.totalStr||''}</span>
        </span>

        <button class="btn btn-icon sb-btn-play" style="${info.isRunning?'color:red':''}"

function getSlotElementFromEvent(ev){
  const node = ev?.currentTarget || ev?.target;
  if(!node) return null;
  if(typeof node.closest === 'function') return node.closest('.time-slot');
  if(node.parentElement && typeof node.parentElement.closest === 'function') return node.parentElement.closest('.time-slot');
  return null;
}

function handleSlotDragStart(ev, sIdx){
  if(ev.dataTransfer){
    ev.dataTransfer.effectAllowed = 'move';
    ev.dataTransfer.setData('application/json', JSON.stringify({ source:'slot', sIdx }));
  }
  const slotEl = getSlotElementFromEvent(ev);
  if(slotEl) slotEl.classList.add('slot-dragging');
}

function handleSlotDragEnd(ev){
  const slotEl = getSlotElementFromEvent(ev);
  if(slotEl) slotEl.classList.remove('slot-dragging');
}


function addToSlot(date, sIdx, ref) {
  if(timelineAdding) return;
  const slot = DATA.dailyHistory[date].slots[sIdx];
  if(ref.type==='adhoc' || !slot.cardIds.some(x => x.id === ref.id && x.type === ref.type)) {
    const minute = selectorState?.date === date && selectorState.slotIdx === sIdx ? selectorState.startMinute : undefined;
    placePlannedCard(slot, ref,minute);
    if(minute != null) selectorState.startMinute = ref.endMinute;
    slot.cardIds.push(ref);
    saveData(); renderDailySidebar();
  }
}

  if(!ref) return;
  ref.expanded = !ref.expanded;

function toggleChildDone(type, id, pid, checked){
  const v = !!checked;

  if(type === 'detail'){
    const c = (DATA.details?.[pid]?.cards || []).find(x=>x.id===id);
    if(c) c.done = v;
  } else if(type === 'theory'){
    const t = DATA.modules?.[pid]?.tabs?.find(x=>x.id===id);
    if(t) t.done = v;
  } else if(type === 'question'){
    const mod = DATA.modules?.[pid];
    if(mod){
      for(const t of (mod.tabs||[])){
        const q = (t.questions||[]).find(x=>x.id===id);
        if(q){ q.done = v; break; }
      }
    }
  } else if(type === 'subject'){
    toggleCheckAllSubject(id, v);
  }

  saveData();
  renderDailySidebar();
  renderRouter(true);
}

function resetDailyToday() {

  if(!confirm(`[${date}] 실행시간 기록만 초기화하시겠습니까?\n계획, 시간 블록, 세부목표, 완료 상태와 목표시간은 유지됩니다.`)) return;

      const matches=session=>timerRefMatches(session.ref,ref);
      if(planDate===date){
        ref.time=planningSessionSeconds(Object.entries(DATA.dailyHistory || {}).filter(([d])=>d!==date).flatMap(([,other])=>other.sessions || []).filter(matches));

      }
    }));
  });
  daily.totalSeconds = 0;
  daily.sessions = [];
  (daily.slots || []).forEach(slot=>(slot.cardIds || []).forEach(ref=>{ if(ref.type!=='adhoc') ref.time = 0; }));
  if(date === getLogicalDate()){

function buildDailyPlanText(date){
  const daily = DATA.dailyHistory[date];
  if(!daily) return null;
  // Storage ownership is retained when a card moves; export its visible region.
  const groups = daily.slots.filter(s=>!s.cardOnly).map(slot=>({slot,cards:[]}));
  const outside = {label:'영역 밖 계획',cards:[]}, unscheduled = {label:'시간 미지정',cards:[]};
  daily.slots.forEach(owner=>(owner.cardIds || []).forEach(card=>{
    let target;
    if(hasTimelineRange(card)){
      let bestOverlap = 0;
      groups.forEach(group=>{
        if(!hasTimelineRange(group.slot)) return;
        const overlap = Math.min(card.endMinute,group.slot.endMinute)-Math.max(card.startMinute,group.slot.startMinute);
        if(overlap > bestOverlap){ bestOverlap=overlap; target=group; }
      });
      target ||= outside;
    } else target = groups.find(group=>group.slot === owner) || unscheduled;
    target.cards.push(card);
  }));
  groups.sort((a,b)=>(a.slot.startMinute ?? Infinity)-(b.slot.startMinute ?? Infinity));
  let txt = `📅 [${date}] 일일 계획\n\n`;
  [...groups,...[outside,unscheduled].filter(group=>group.cards.length)].forEach(group=>{
    const label = group.label || timelineSlotLabel(group.slot).trim() || (hasTimelineRange(group.slot) ? timelineRange(group.slot) : '시간 미지정');
    txt += `■ ${label}\n`;
    group.cards.sort((a,b)=>(a.startMinute ?? Infinity)-(b.startMinute ?? Infinity)).forEach(c => {
      const info = getCardInfo(c);
      const progress = timelinePlanProgress(c);
      txt += `  - [${progress.done === progress.total?'v':' '}] ${info.title} (${formatTime(c.time||0)})\n`;
      selectedTimelineSubgoals(c).forEach(target=>{
        const child = getCardInfo(target);
        txt += `    - [${child.done?'v':' '}] ${child.title}\n`;
      });
    });
    txt += `\n`;
  });
  txt += `⏱ Total: ${formatTime(daily.totalSeconds||0)} / Goal: ${daily.goalStr||"00:00:00"}`;
  return txt;
}
function copyDailyPlan() {
  const txt = buildDailyPlanText(VIEW_DATE);
  if(txt == null) { alert("계획이 없습니다."); return; }
  navigator.clipboard.writeText(txt).then(() => showToast('클립보드에 복사되었습니다')).catch(()=>{
    // fallback
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    ta.remove();
    showToast('클립보드에 복사되었습니다');
  });
}

/* =========================
   TIMER CORE
========================= */
let __lastTimerTickAt = Date.now();
let __timerCarryMs = 0;
let __lastTimerPersistAt = Date.now();
let __timerDirty = false;
let __timerDate = getLogicalDate();

function splitTimerSecondsByKstDate(startMs, totalSeconds){
  const segments = [];
  let sampleMs = startMs + 500;
  let remaining = totalSeconds;
  while(remaining > 0){
    const date = getLogicalDate(new Date(sampleMs));
    const nextMidnightMs = ymdToUtcDayMs(addDaysYMD(date, 1)) - KST_OFFSET_MS;
    const untilMidnight = Math.max(1, Math.ceil((nextMidnightMs - sampleMs) / 1000));
    const seconds = Math.min(remaining, untilMidnight);
    segments.push({date, seconds});
    sampleMs += seconds * 1000;
    remaining -= seconds;
  }
  return segments;
}

function timerRefMatches(ref, running){
  if(!ref || !running || ref.type !== running.type) return false;
  if(String(ref.id) !== String(running.id)) return false;
  if(running.pid != null && ref.pid != null) return String(ref.pid) === String(running.pid);
  return true;
}

function findCanonicalTimerItem(type, id, pid){
  if(type === 'subject') return (DATA.home?.subjects || []).find(item => String(item.id) === String(id)) || null;
  if(type === 'detail') return (DATA.details?.[pid]?.cards || []).find(item => String(item.id) === String(id)) || null;
  if(type === 'theory') return (DATA.modules?.[pid]?.tabs || []).find(item => String(item.id) === String(id)) || null;
  if(type === 'question'){
    for(const tab of DATA.modules?.[pid]?.tabs || []){
      const question = (tab.questions || []).find(item => String(item.id) === String(id));
      if(question) return question;
    }
  }
  return null;
}

function stopCanonicalTimer(type, id, pid){
  const item = findCanonicalTimerItem(type, id, pid);
  if(item) item.isRunning = false;
  setDailyRefRunning(type, id, pid, false);
}

function setDailyRefRunning(type, id, pid, running, activeDate = getLogicalDate()){
  Object.entries(DATA.dailyHistory || {}).forEach(([date, daily])=>{
    (daily.slots || []).forEach(slot=>{
      (slot.cardIds || []).forEach(ref=>{
        if(!timerRefMatches(ref, {type, id, pid})) return;
        ref.isRunning = !!running && date === activeDate;
      });
    });
  });
}

function syncDailyTimerRunningState(activeDate = getLogicalDate()){
  Object.entries(DATA.dailyHistory || {}).forEach(([date, daily])=>{
    (daily.slots || []).forEach(slot=>{
      (slot.cardIds || []).forEach(ref=>{
        if(ref.type === 'adhoc') return;
        if(date !== activeDate){
          ref.isRunning = false;
          return;
        }
        if(ref.type === 'adhoc'){
          ref.isRunning = !!ref.isRunning;
          return;
        }
        const canonical = findCanonicalTimerItem(ref.type, ref.id, ref.pid);
        ref.isRunning = !!canonical?.isRunning;
      });
    });
  });
}

function persistTimerState(force = false, notify = true){
  if(!__timerDirty) return true;
  const now = Date.now();
  if(!force && now - __lastTimerPersistAt < 5000) return true;
  const saved = saveData({notify});
  __lastTimerPersistAt = now;
  if(saved){
    __timerDirty = false;
  }
  return saved;
}

function tickOneSecond(){
  const nowMs = Date.now();
  if(!DATA){
    __lastTimerTickAt = nowMs;
    __timerCarryMs = 0;
    return;
  }
  const elapsedMs = Math.max(0, nowMs - __lastTimerTickAt);
  __lastTimerTickAt = nowMs;
  __timerCarryMs += elapsedMs;
  const deltaSeconds = Math.floor(__timerCarryMs / 1000);
  if(deltaSeconds <= 0) return;
  __timerCarryMs -= deltaSeconds * 1000;
  const countedEndMs = nowMs - __timerCarryMs;
  const dateSegments = splitTimerSecondsByKstDate(countedEndMs - deltaSeconds * 1000, deltaSeconds);

  const today = getLogicalDate(new Date(nowMs));
  const dateChanged = __timerDate !== today;

  let anyRunningMain = false;
  const runningRefs = [];

  (DATA.home.subjects||[]).forEach(s=>{
    if(s.isRunning){
      s.time = (s.time||0) + deltaSeconds;
      anyRunningMain = true;
      runningRefs.push({type:'subject', id:s.id, pid:null});
    }
  });

  Object.entries(DATA.details||{}).forEach(([sid, d])=>{
    (d.cards||[]).forEach(c=>{
      if(c.isRunning){
        c.time = (c.time||0) + deltaSeconds;
        anyRunningMain = true;
        runningRefs.push({type:'detail', id:c.id, pid:sid});
      }
    });
  });

  Object.entries(DATA.modules||{}).forEach(([mid, m])=>{
    (m.tabs||[]).forEach(t=>{
      if(t.isRunning){
        t.time = (t.time||0) + deltaSeconds;
        anyRunningMain = true;
        runningRefs.push({type:'theory', id:t.id, pid:mid});
      }
      (t.questions||[]).forEach(q=>{
        if(q.isRunning){
          q.time = (q.time||0) + deltaSeconds;
          anyRunningMain = true;
          runningRefs.push({type:'question', id:q.id, pid:mid});
        }
      });
    });
  });

  const parentsToBump = new Map();
  const countedStartMs = countedEndMs - deltaSeconds * 1000;
  runningRefs.forEach(ref=>recordTimelineSession(ref,countedStartMs,countedEndMs));
  const runningAdhoc = Object.values(DATA.dailyHistory || {}).flatMap(d=>(d.slots || []).flatMap(s=>s.cardIds || []))
    .filter(ref=>ref.type === 'adhoc' && ref.isRunning);
  runningAdhoc.forEach(ref=>{
    ref.time = (ref.time || 0) + deltaSeconds;
    recordTimelineSession(ref,countedStartMs,countedEndMs);
  });
  if(runningRefs.length){
    runningRefs.forEach(r=>{
      const parents = getParentRefsForRunning(r);
      parents.forEach(p=>{
        const key = `${p.type}|${p.id}|${p.pid==null?'':p.pid}`;
        if(!parentsToBump.has(key)) parentsToBump.set(key, p);
      });
    });
  }

  dateSegments.forEach(segment=>{
    const daily = ensureDailyData(segment.date);
    const anyRunningAdhoc = runningAdhoc.length > 0;
    (daily.slots || []).forEach(slot=>{
      (slot.cardIds || []).forEach(ref=>{
        if(ref.type === 'adhoc'){
          return;
        }
        const running = runningRefs.find(item => timerRefMatches(ref, item));
        if(segment.date === today) ref.isRunning = !!running;
        if(running) ref.time = (ref.time || 0) + segment.seconds;
      });
    });

    if(runningRefs.length){
      parentsToBump.forEach(parent=>{
        const parentRunsDirectly = runningRefs.some(running => timerRefMatches(parent, running));
        if(!parentRunsDirectly) incrementDailyRefTime(daily, parent.type, parent.id, parent.pid, segment.seconds);
      });
    }

    if(anyRunningMain || anyRunningAdhoc){
      daily.totalSeconds = (daily.totalSeconds || 0) + segment.seconds;
      __timerDirty = true;
    }
  });

  if(dateChanged){
    __timerDate = today;
    syncDailyTimerRunningState(today);
    __timerDirty = true;
  }
  persistTimerState();

  updateTimerDOM();
  updateSidebarTimerDOM();
  updatePlanningTimerDOM();
  updateTimelineExecution();

  if(document.getElementById('daily-sidebar')?.classList.contains('open')){
    const dailyView = ensureDailyData(VIEW_DATE);
    const tEl = document.getElementById('todayTotal');
    if(tEl) tEl.innerText = formatTime(dailyView.totalSeconds || 0);
    checkGoalColor(dailyView.totalSeconds || 0, dailyView.goalStr || "00:00:00");
  }
}

  const today = getLogicalDate();
  const canonical = type === 'adhoc' ? null : findCanonicalTimerItem(type, id, pid);
  const isRunning = type === 'adhoc' ? !!ref.isRunning : !!canonical?.isRunning;
  const nextRunning = !isRunning;
  // The viewed plan date never changes the clock or the date of execution logs.
  if(type !== 'adhoc' && !canonical){
    ref.isRunning = false;
    alert('연결된 카드를 찾을 수 없습니다. 일일 계획에서 이 항목을 삭제한 뒤 다시 추가해 주세요.');
    renderDailySidebar();
    return;
  }
  if(type === 'adhoc') ref.isRunning = nextRunning;
  else {
    canonical.isRunning = nextRunning;
    setDailyRefRunning(type, id, pid, nextRunning, today);
  }
  __lastTimerTickAt = Date.now(); __timerCarryMs = 0;
  __timerDirty = true;
  persistTimerState(true);
  renderWithScrollPreserved();
  return nextRunning;
}

function toggleDetailCardStatus(pid, idx, status){
  if(!DATA.details?.[pid]) return;
  const card = DATA.details[pid].cards?.[idx];
  if(!card) return;

  const v = !!status;

  // 1) Update card
  card.done = v;
  if(v) stopCanonicalTimer('detail', card.id, pid);

  // 2) Propagate to module (so computed completion matches UI)
  if(card.module && DATA.modules?.[card.module]){
    const mod = DATA.modules[card.module];
    (mod.tabs||[]).forEach(t=>{
      t.done = v;
      if(v) stopCanonicalTimer('theory', t.id, card.module);
      (t.questions||[]).forEach(q=>{
        q.done = v;
        if(v) stopCanonicalTimer('question', q.id, card.module);
      });
    });
  }

  // 3) If subject now complete, stop subject timer
  if(v){
    const stats = calcSubjectStats(pid);
    if(stats.isComplete){
      const subj = DATA.home?.subjects?.find(s=>s.id===pid);
      if(subj) stopCanonicalTimer('subject', subj.id, null);
    }
  }

  saveData();
  renderRouter(true);
  renderDailySidebar();
}

function editTime(level, pid, idx, tabId){
  let cur = 0, target = null, label = '';
  if(level==='subject'){
    target = DATA.home.subjects[idx]; label='과목'; cur = target?.time||0;
  } else if(level==='detail'){
    target = (DATA.details?.[pid]?.cards||[])[idx]; label='카드'; cur = target?.time||0;
  } else if(level==='theory'){
    target = DATA.modules?.[pid]?.tabs?.find(x=>x.id===tabId); label='이론'; cur = target?.time||0;
  } else if(level==='module'){
    const tab = DATA.modules?.[pid]?.tabs?.find(x=>x.id===tabId) || DATA.modules?.[pid]?.tabs?.[0];
    target = tab?.questions?.[idx]; label='문항'; cur = target?.time||0;
  }
  if(!target) return;
  const val = prompt(`${label} 시간(초) 또는 HH:MM:SS 입력`, formatTime(cur));
  if(val==null) return;
  let sec = null;
  if(/^\d+$/.test(val.trim())){
    sec = Number(val.trim());
  } else {
    const parts = val.split(':').map(x=>Number(x));
    if(parts.length===3 && parts.every(n=>Number.isFinite(n))){
      sec = parts[0]*3600 + parts[1]*60 + parts[2];
    }
  }
  if(sec==null || !Number.isFinite(sec) || sec<0) return alert('형식이 올바르지 않습니다.');
  target.time = sec;
  saveData(); renderRouter(true); renderDailySidebar();
}

function resetAccumulatedTime(level, pid, idx, tabId){

  if(level === 'all'){
    if(!confirm('모든 카드의 누적 시간을 초기화하시겠습니까?')) return;
    (DATA.home?.subjects||[]).forEach(clearItemTime);
    Object.values(DATA.details||{}).forEach(d => (d.cards||[]).forEach(clearItemTime));
    Object.values(DATA.modules||{}).forEach(m => (m.tabs||[]).forEach(t => { clearItemTime(t); (t.questions||[]).forEach(clearItemTime); }));
    Object.values(DATA.dailyHistory||{}).forEach(day => {
      day.totalSeconds = 0;
      (day.slots||[]).forEach(slot => (slot.cardIds||[]).forEach(ref => { ref.time = 0; ref.isRunning = false; }));
    });
  } else {
    let target = null;
    let type = '';
    let id = '';
    let refPid = pid;
    if(level==='subject'){
      target = DATA.home?.subjects?.[idx];
      type = 'subject';
      refPid = null;
    }
    else if(level==='detail'){
      target = DATA.details?.[pid]?.cards?.[idx];
      type = 'detail';
    }
    else if(level==='theory'){
      target = DATA.modules?.[pid]?.tabs?.find(t => String(t.id)===String(tabId));
      type = 'theory';
    }
    else if(level==='module'){
      const tab = DATA.modules?.[pid]?.tabs?.find(t => String(t.id)===String(tabId)) || DATA.modules?.[pid]?.tabs?.[0];
      target = tab?.questions?.[idx];
      type = 'question';
    }
    if(!target) return;
    if(!confirm('이 카드의 누적 시간을 초기화하시겠습니까?')) return;
    id = target.id;
    clearItemTime(target);
    setDailyRefRunning(type, id, refPid, false);
  }

  saveData();
  if(typeof renderRouter === 'function') renderRouter(true);
  if(typeof renderDailySidebar === 'function') renderDailySidebar();
}

const noteAutosaveTimers = new WeakMap();

function persistNoteDraftFromTextarea(ta){
  if(!ta || ta.dataset.autosave !== '1') return false;
  const kind = ta.dataset.kind;
  const mid = ta.dataset.mid;
  if(kind === 'theory'){
    const tid = ta.dataset.tid;
    const mod = DATA.modules?.[mid];
    if(!mod) return false;
    const tab = (mod.tabs||[]).find(t => String(t.id)===String(tid));
    if(!tab) return false;
    tab.theoryNote = ta.value || '';
    saveData();
    return true;
  }
  if(kind === 'card'){
    const tabId = ta.dataset.tabid;
    const idx = Number(ta.dataset.idx);
    const mod = DATA.modules?.[mid];
    if(!mod || Number.isNaN(idx)) return false;
    const tab = (mod.tabs||[]).find(t => String(t.id)===String(tabId)) || (mod.tabs||[])[0];
    const q = tab?.questions?.[idx];
    if(!q) return false;
    q.userNote = ta.value || '';
    saveData();
    return true;
  }
  return false;
}

function queueNoteDraftAutosave(ta){
  if(!ta || ta.dataset.autosave !== '1') return;
  const prev = noteAutosaveTimers.get(ta);
  if(prev) clearTimeout(prev);
  const timer = setTimeout(() => {
    persistNoteDraftFromTextarea(ta);
    noteAutosaveTimers.delete(ta);
  }, 300);
  noteAutosaveTimers.set(ta, timer);
}

document.addEventListener('input', (ev) => {
  const ta = ev.target;
  if(!(ta instanceof HTMLTextAreaElement)) return;
  if(ta.classList.contains('note-textarea')) queueNoteDraftAutosave(ta);
});

window.addEventListener('beforeunload', () => {
  document.querySelectorAll('textarea.note-textarea[data-autosave="1"]').forEach((ta) => {
    const timer = noteAutosaveTimers.get(ta);
    if(timer){
      clearTimeout(timer);
      noteAutosaveTimers.delete(ta);
    }
    persistNoteDraftFromTextarea(ta);
  });
  if(__timerDirty) persistTimerState(true, false);
});

function saveNoteText(kind, mid, idx, tid, sid){
  try{
    if(kind==='theory'){
      const tab = DATA.modules?.[mid]?.tabs?.find(x=>x.id===tid);
      if(!tab) return;

function autoGrowTextarea(el, minHeightPx){
  if(!el) return;
  const minH = (typeof minHeightPx==='number') ? minHeightPx : 0;
  const resize = ()=>{
    el.style.height = 'auto';
    const h = Math.max(el.scrollHeight, minH);
    el.style.height = h + 'px';
  };
  // avoid duplicate listeners
  if(!el.__autogrowBound){
    el.addEventListener('input', resize);
    el.__autogrowBound = true;
  }
  resize();
}

function purgeDailyRefs(predicate){
  const removedGoals=(DATA.periodGoals || []).filter(g=>predicate(g.root) || predicate(g.scope)).map(g=>g.id);
  (DATA.periodGoals || []).filter(g=>removedGoals.includes(g.parentGoalId)).forEach(g=>removedGoals.push(g.id));
  DATA.periodGoals=(DATA.periodGoals || []).filter(g=>!removedGoals.includes(g.id));
  DATA.periodGoals.forEach(g=>{
    g.targets=g.targets.filter(r=>!predicate(r));
    g.knownRefs=g.knownRefs.filter(r=>!predicate(r));
  });
  if(!DATA.dailyHistory) return;
  Object.keys(DATA.dailyHistory).forEach(date=>{
    const day = DATA.dailyHistory[date];
    (day.slots||[]).forEach(slot=>{
      if(!Array.isArray(slot.cardIds)) return;
      slot.cardIds = slot.cardIds.filter(ref=>!predicate(ref));
      slot.cardIds.forEach(ref=>{
        if(removedGoals.includes(ref.goalId)) delete ref.goalId;
        if(!Array.isArray(ref.progressTargets)) return;
        ref.progressTargets = ref.progressTargets.filter(target=>!predicate(target));
        if(!ref.progressTargets.length) delete ref.progressTargets;
      });
    });
  });
}

function isModuleReferenced(mid){
  return Object.values(DATA.details || {}).some(detail =>
    (detail.cards || []).some(card => String(card.module || '') === String(mid))
  );
}

function purgeModuleDailyRefs(mid){
  purgeDailyRefs(ref =>
    (ref.type === 'theory' || ref.type === 'question') && String(ref.pid) === String(mid)
  );
}

function deleteModuleIfUnreferenced(mid){
  if(!mid || !DATA.modules?.[mid] || isModuleReferenced(mid)) return false;
  purgeModuleDailyRefs(mid);
  delete DATA.modules[mid];
  return true;
}

function purgeTabDailyRefs(mid, tab){
  if(!tab) return;
  const questionIds = new Set((tab.questions || []).map(question => String(question.id)));
  purgeDailyRefs(ref => {
    if(String(ref.pid) !== String(mid)) return false;
    if(ref.type === 'theory' && String(ref.id) === String(tab.id)) return true;
    return ref.type === 'question' && questionIds.has(String(ref.id));
  });
}


function saveCardChange(){
  const titleTAWrap = document.getElementById('grpTitleTA');
  const usingTA = (titleTAWrap && titleTAWrap.style.display !== 'none');
  const t = (usingTA ? document.getElementById('editTitleTA').value : document.getElementById('editTitle').value) || '';
  const d = document.getElementById('editDesc').value || '';
  const b = document.getElementById('editBadge').value || '';
  const q = document.getElementById('editQBox').value || '';
  const { mode, pid, idx, tabId, pageId } = editState || {};

  if(mode === 'app_info'){
    DATA.home.title = t;
    DATA.home.subtitle = d;
  }
  else if(mode === 'page_info'){
    const id = pageId;
    if(DATA.details?.[id]){ DATA.details[id].title = t; DATA.details[id].subtitle = d; }
    else if(DATA.modules?.[id]){ DATA.modules[id].title = t; DATA.modules[id].subtitle = d; }
  }
  else if(mode === 'tab_rename'){
    const tab = DATA.modules?.[pid]?.tabs?.find(x=>x.id===tabId);
    if(tab) tab.label = t;
  }
  else if(mode === 'tab_add'){
    const mod = DATA.modules?.[pid];
    if(mod){
      const label = t.trim() || '새 탭';
      mod.tabs = mod.tabs || [];
      mod.tabs.push({ id: uid('tab'), label, questions: [] });
    }
  }
  else if(mode === 'subject'){
    if(idx===undefined){
      DATA.home.subjects.push({ id: uid('s'), name: t.trim()||'새 과목', examInfo: d, badge: b, done:false, time:0, today:0 });
    }else{
      const s = DATA.home.subjects[idx];
      if(s){ s.name = t.trim()||s.name||'과목'; s.examInfo = d; s.badge = b; }
    }
  }
  else if(mode === 'detail'){
    const deck = DATA.details?.[pid];
    if(deck){
      deck.cards = deck.cards || [];
      if(idx===undefined){
        deck.cards.push({ id: uid('c'), title: t.trim()||'새 카드', scope: d, badge: b, qbox: q, moduleId:null, time:0, done:false, isRunning:false });
      }else{
        const c = deck.cards[idx];
        if(c){ c.title = t.trim()||c.title; c.scope = d; c.badge = b; c.qbox = q; }
      }
    }
  }
  else if(mode === 'module'){
    const mod = DATA.modules?.[pid];
    const tab = mod?.tabs?.find(x=>x.id===tabId) || mod?.tabs?.[0];
    if(tab){
      const txt = t.trim();
      const src = d.trim();
      if(!txt){ alert('문항을 입력하세요.'); return; }
      tab.questions = tab.questions || [];
      if(idx===undefined){
        tab.questions.push({ id: uid('q'), src, text: txt, userNote:'', time:0, done:false, isRunning:false });
      }else{
        const qq = tab.questions[idx];
        if(qq){ qq.text = txt; qq.src = src; }
      }
    }
  }
  else if(mode === 'dday'){
    if(!DATA.home.dDays) DATA.home.dDays = [];
    const label = (t.trim() || 'D-Day');
    const date = d.trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return alert('형식: YYYY-MM-DD');

    if(idx===undefined){
      if(DATA.home.dDays.length >= 10) return alert('D-Day는 최대 10개까지 가능합니다.');
      DATA.home.dDays.push({ label, date });
    }else{
      const item = DATA.home.dDays[idx];
      if(item){ item.label = label; item.date = date; }
    }
    saveData();
    updateDDayPanel();
    renderRouter(true);
    closeModal();
    return;
  }

  saveData();
  closeModal();
  renderRouter(true);
  updateDDayPanel();
}

function modalDeleteAction(){

  if(mode !== 'dday') return;

function deleteSelectedCards(level, pid, tabId){
  const selected = getSelectedIndices(level, pid, tabId);
  if(!selected.length) return alert('선택된 카드가 없습니다.');
  if(!confirm(`선택한 ${selected.length}개 카드를 삭제하시겠습니까?`)) return;

  if(level==='home'){
    const modulesToCheck = new Set();
    [...selected].sort((a,b)=>b-a).forEach(i=>{
      const s = DATA.home?.subjects?.[i];
      if(!s) return;
      const sid = s.id;
      const d = DATA.details?.[sid];
      if(d){
        (d.cards||[]).forEach(c=>{ if(c.module) modulesToCheck.add(c.module); });
        delete DATA.details[sid];
      }
      DATA.home.subjects.splice(i,1);
      purgeDailyRefs(ref=>
        (ref.type==='subject' && String(ref.id)===String(sid)) ||
        (ref.type==='detail' && String(ref.pid)===String(sid))
      );
    });
    modulesToCheck.forEach(deleteModuleIfUnreferenced);
  }else if(level==='detail'){
    const list = DATA.details?.[pid]?.cards || [];
    const modulesToCheck = new Set();
    [...selected].sort((a,b)=>b-a).forEach(i=>{
      const c = list[i];
      if(!c) return;
      if(c.module) modulesToCheck.add(c.module);
      list.splice(i,1);
      purgeDailyRefs(ref=> (ref.type==='detail' && String(ref.id)===String(c.id) && String(ref.pid)===String(pid)));
    });
    modulesToCheck.forEach(deleteModuleIfUnreferenced);
  }else if(level==='module'){
    const mod = DATA.modules?.[pid];
    const tab = mod?.tabs?.find(t=>t.id===tabId) || mod?.tabs?.[0];
    if(!tab || !Array.isArray(tab.questions)) return;
    [...selected].sort((a,b)=>b-a).forEach(i=>{
      const q = tab.questions[i];
      if(!q) return;
      tab.questions.splice(i,1);
      purgeDailyRefs(ref=> (ref.type==='question' && ref.id===q.id && String(ref.pid)===String(pid)));
    });
  }

  clearSelectedInView(level, pid, tabId);
  saveData();
  renderRouter(true);
  renderDailySidebar();
}

function moveSelectedCards(level, pid, tabId){
  const selected = getSelectedIndices(level, pid, tabId);

  if(level==='detail'){

  }else if(level==='module'){
    selectorMode = 'move_question';

  document.getElementById('selectorModal').style.display = 'flex';
  renderSelectorUI();
}

function deleteCard(mode, pid, idx, tabId){
  if(!confirm('삭제하시겠습니까? (연결된 하위 데이터도 함께 삭제될 수 있습니다)')) return;

  if(mode === 'subject'){
    const s = DATA.home.subjects[idx];
    if(!s) return;
    const sid = s.id;
    const modulesToCheck = new Set();
    const d = DATA.details?.[sid];
    if(d){
      (d.cards||[]).forEach(c=>{ if(c.module) modulesToCheck.add(c.module); });
      delete DATA.details[sid];
    }
    DATA.home.subjects.splice(idx,1);
    purgeDailyRefs(ref=>
      (ref.type==='subject' && String(ref.id)===String(sid)) ||
      (ref.type==='detail' && String(ref.pid)===String(sid))
    );
    modulesToCheck.forEach(deleteModuleIfUnreferenced);
  }
  else if(mode === 'detail'){
    const list = DATA.details?.[pid]?.cards || [];
    const c = list[idx];
    if(!c) return;
    const moduleId = c.module;
    list.splice(idx,1);
    purgeDailyRefs(ref=> (ref.type==='detail' && String(ref.id)===String(c.id) && String(ref.pid)===String(pid)));
    deleteModuleIfUnreferenced(moduleId);
  }
  else if(mode === 'module'){
    const mod = DATA.modules?.[pid];
    const tab = mod?.tabs?.find(x=>x.id===tabId) || mod?.tabs?.[0];
    const q = (tab?.questions||[])[idx];
    if(!q) return;
    tab.questions.splice(idx,1);
    purgeDailyRefs(ref=> (ref.type==='question' && ref.id===q.id && ref.pid===pid));
  }

  saveData();
  renderRouter(true);
  renderDailySidebar();
}

// Duplicate a subject (and its linked detail page + modules)
function duplicateSubject(idx){
  const src = (DATA.home?.subjects||[])[idx];
  if(!src) return;

  // 1) Duplicate subject row
  const newSid = uid('s');
  const ns = JSON.parse(JSON.stringify(src));
  ns.id = newSid;
  ns.name = (ns.name || '새 과목') + ' (복제)';
  ns.time = 0; ns.done = false; ns.isRunning = false;
  (DATA.home.subjects||[]).splice(idx+1, 0, ns);

  // 2) Duplicate detail page
  const srcDetail = DATA.details?.[src.id] || { id: src.id, title: src.name||'새 과목', subtitle: '', cards: [] };
  const nd = JSON.parse(JSON.stringify(srcDetail));
  nd.id = newSid;
  nd.title = ns.name || nd.title;
  nd.cards = Array.isArray(nd.cards) ? nd.cards : [];

  // 3) Duplicate linked modules and rewire card.module
  const modMap = {};
  nd.cards.forEach(card => {
    card.id = uid('card');
    card.time = 0; card.done = false; card.isRunning = false;

    if(card.module && DATA.modules?.[card.module]){
      const oldMid = card.module;
      if(!modMap[oldMid]){
        const newMid = uid('m');
        modMap[oldMid] = newMid;
        const nm = JSON.parse(JSON.stringify(DATA.modules[oldMid]));
        nm.id = newMid;
        nm.backTo = `#/detail/${newSid}`;
        nm.time = 0; nm.done = false; nm.isRunning = false;
        nm.tabs = Array.isArray(nm.tabs) ? nm.tabs : [{ id: 't1', label: '이론', questions: [] }];

        nm.tabs.forEach(tab => {
          // keep tab.id as-is is OK, but regenerate to avoid collisions in focus/hash usage
          tab.id = uid('t');
          tab.time = 0; tab.done = false; tab.isRunning = false;
          tab.questions = Array.isArray(tab.questions) ? tab.questions : [];
          tab.questions.forEach(q => {
            q.id = uid('q');
            q.time = 0; q.done = false; q.isRunning = false;
          });
        });
        nm.activeTab = nm.tabs?.[0]?.id || 't1';
        DATA.modules[newMid] = nm;
      }
      card.module = modMap[oldMid];
    } else {
      // If the old module doesn't exist, drop linkage
      card.module = card.module && !DATA.modules?.[card.module] ? null : card.module;
    }
  });

  DATA.details[newSid] = nd;

  saveData();
  renderHome();
  renderDailySidebar();
}

function exportAnki(mid){
  const mod = DATA.modules[mid];
  if(!mod) return alert('모듈을 찾을 수 없습니다.');
  const rows = [];
  mod.tabs.forEach(t=>{
    (t.questions||[]).forEach(q=>{
      const front = (q.src || t.label || 'Question').toString().replace(/\t|\n/g,' ').trim();
      const back  = (q.text || '').toString().replace(/\t/g,'    ').trim();
      const note  = (q.userNote || '').toString().replace(/\t/g,'    ').trim();
      rows.push([front, back, note].join('\t'));
    });
  });
  const blob = new Blob([rows.join('\n')], {type:'text/tab-separated-values;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `anki_${mid}_${toYMDLocal(new Date())}.tsv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function __updateDailyRefs(pred, mut){
  (DATA.periodGoals || []).forEach(goal=>{
    [goal.root,goal.scope,...goal.targets,...goal.knownRefs].forEach(ref=>{if(pred(ref)) mut(ref);});
  });
  const dh = DATA.dailyHistory || {};
  for(const date of Object.keys(dh)){
    const daily = dh[date];
    if(!daily || !Array.isArray(daily.slots)) continue;
    for(const slot of daily.slots){
      if(!slot || !Array.isArray(slot.cardIds)) continue;
      for(const ref of slot.cardIds){
        if(ref && pred(ref)) mut(ref);
        (ref?.progressTargets || []).forEach(target=>{ if(pred(target)) mut(target); });
      }
    }
  }
  const catalog=planningCatalog();
  (DATA.periodGoals || []).forEach(goal=>{
    const root=catalog.find(item=>planningKey(item.ref)===planningKey(goal.root));
    if(root) goal.scope=planningRef(root.scope);
  });
  Object.keys(dh).forEach(date=>planningPlans(date).forEach(({ref})=>{
    const goal=planningGoal(ref.goalId),parent=planningGoal(goal?.parentGoalId);
    if(parent && date>=parent.startDate && date<=parent.endDate && catalog.some(item=>planningKey(item.ref)===planningKey(ref))){
      ref.goalId=planningWeeklyGoal(DATA,parent,date,ref,catalog).id;
    }
  }));
  (DATA.periodGoals || []).filter(goal=>goal.parentGoalId).forEach(goal=>{
    const allowed=new Set(planningUnits(goal.scope).map(planningKey));
    goal.targets=goal.targets.filter(ref=>allowed.has(planningKey(ref)));
  });
}

function nextUniquePlannerId(prefix, usedIds){
  let id = uid(prefix);
  while(usedIds.has(String(id))) id = uid(prefix);
  usedIds.add(String(id));
  return id;
}

function openMoveDetailCard(fromSid, fromIdx){

function selectorMoveDetail(targetSid){
  if(!moveState || !moveState.fromSid) return;
  const fromSid = moveState.fromSid;
  if(String(targetSid) === String(fromSid)) return;

  const fromDetail = DATA.details?.[fromSid];
  if(!fromDetail || !Array.isArray(fromDetail.cards)) return;

  const multi = Array.isArray(moveState.multi) && moveState.multi.length
    ? [...new Set(moveState.multi)].sort((a,b)=>a-b)
    : [moveState.fromIdx];

  if(!DATA.details[targetSid]) DATA.details[targetSid] = { id: targetSid, cards: [] };
  if(!Array.isArray(DATA.details[targetSid].cards)) DATA.details[targetSid].cards = [];

  const movedCards = [];
  [...multi].sort((a,b)=>b-a).forEach(i=>{
    const card = fromDetail.cards.splice(i, 1)[0];
    if(card) movedCards.push(card);
  });
  movedCards.reverse().forEach(card=>DATA.details[targetSid].cards.push(card));

  movedCards.forEach(card=>{
    if(card.module && DATA.modules?.[card.module]) DATA.modules[card.module].backTo = `#/detail/${targetSid}`;
    __updateDailyRefs(
      ref => (ref.type==='detail' && ref.id===card.id && String(ref.pid)===String(fromSid)),
      ref => { ref.pid = targetSid; }
    );
  });
  clearSelectedInView('detail', fromSid, null);

  saveData();
  closeSelectorModal();

  const r = getRoute();
  if(r.page==='detail') renderDetail(r.id);
  else renderRouter(true);
  renderDailySidebar();
}

function selectorMoveQuestion(destMid, destTabId){
  if(!moveState || !moveState.fromMid) return;
  const fromMid = moveState.fromMid;
  const fromTabId = moveState.fromTabId;

  if(String(destMid)===String(fromMid) && String(destTabId||'')===String(fromTabId||'')) return;

  const srcMod = DATA.modules?.[fromMid];
  const dstMod = DATA.modules?.[destMid];
  if(!srcMod || !dstMod) return;

  const srcTab = srcMod.tabs.find(t=>t.id===fromTabId) || srcMod.tabs[0];
  const dstTab = dstMod.tabs.find(t=>t.id===destTabId) || dstMod.tabs[0];
  if(!srcTab || !dstTab) return;

  if(!Array.isArray(srcTab.questions)) srcTab.questions = [];
  if(!Array.isArray(dstTab.questions)) dstTab.questions = [];

  const multi = Array.isArray(moveState.multi) && moveState.multi.length
    ? [...new Set(moveState.multi)].sort((a,b)=>a-b)
    : [moveState.fromQIdx];

  const moved = [];
  [...multi].sort((a,b)=>b-a).forEach(i=>{
    const q = srcTab.questions.splice(i, 1)[0];
    if(q) moved.push(q);
  });
  const destinationIds = new Set((dstMod.tabs || []).flatMap(tab => (tab.questions || []).map(question => String(question.id))));
  const remapped = [];
  moved.reverse().forEach(q=>{
    const oldId = q.id;
    if(destinationIds.has(String(q.id))) q.id = nextUniquePlannerId('q', destinationIds);
    else destinationIds.add(String(q.id));
    dstTab.questions.push(q);
    remapped.push({oldId, newId:q.id});
  });

  remapped.forEach(({oldId, newId})=>{
    __updateDailyRefs(
      ref => (ref.type==='question' && String(ref.id)===String(oldId) && String(ref.pid)===String(fromMid)),
      ref => { ref.id = newId; ref.pid = destMid; }
    );
  });
  clearSelectedInView('module', fromMid, fromTabId);

  saveData();
  closeSelectorModal();

  const r = getRoute();
  if(r.page==='module') renderModule(r.id);
  else renderRouter(true);
  renderDailySidebar();
}

function selectorMoveTheory(destMid){
  if(!moveState || !moveState.fromMid) return;
  const fromMid = moveState.fromMid;
  const fromTabId = moveState.fromTabId;

  if(String(destMid)===String(fromMid)) return;

  const srcMod = DATA.modules?.[fromMid];
  const dstMod = DATA.modules?.[destMid];
  if(!srcMod || !dstMod) return;

  if(!Array.isArray(srcMod.tabs)) srcMod.tabs = [];
  if(!Array.isArray(dstMod.tabs)) dstMod.tabs = [];
  if(srcMod.tabs.length<=1) return alert('탭은 최소 1개가 필요합니다.');

  const srcIdx = srcMod.tabs.findIndex(t=>t.id===fromTabId);
  if(srcIdx<0) return;

  const movingTab = srcMod.tabs.splice(srcIdx, 1)[0];
  if(!movingTab) return;
  const oldTabId = movingTab.id;
  const destinationTabIds = new Set(dstMod.tabs.map(tab => String(tab.id)));
  if(destinationTabIds.has(String(movingTab.id))) movingTab.id = nextUniquePlannerId('t', destinationTabIds);
  else destinationTabIds.add(String(movingTab.id));

  const destinationQuestionIds = new Set(dstMod.tabs.flatMap(tab => (tab.questions || []).map(question => String(question.id))));
  const questionRemaps = (movingTab.questions || []).map(question => {
    const oldId = question.id;
    if(destinationQuestionIds.has(String(question.id))) question.id = nextUniquePlannerId('q', destinationQuestionIds);
    else destinationQuestionIds.add(String(question.id));
    return {oldId, newId:question.id};
  });
  dstMod.tabs.push(movingTab);

  srcMod.activeTab = (srcMod.activeTab===fromTabId)
    ? (srcMod.tabs[0]?.id || '')
    : (srcMod.activeTab || srcMod.tabs[0]?.id || '');
  dstMod.activeTab = movingTab.id;

  __updateDailyRefs(
    ref => (ref.type==='theory' && String(ref.id)===String(oldTabId) && String(ref.pid)===String(fromMid)),
    ref => { ref.id = movingTab.id; ref.pid = destMid; }
  );

  questionRemaps.forEach(({oldId, newId}) => {
    __updateDailyRefs(
      ref => (ref.type==='question' && String(ref.id)===String(oldId) && String(ref.pid)===String(fromMid)),
      ref => { ref.id = newId; ref.pid = destMid; }
    );
  });

  saveData();
  closeSelectorModal();

  const r = getRoute();
  if(r.page==='module') renderModule(r.id);
  else renderRouter(true);
  renderDailySidebar();
}



/* =========================
   INIT
========================= */
async function init(){
  const theme = localStorage.getItem(THEME_KEY) || 'light';
  applyTheme(theme);

  const raw = readStoredPlannerRaw();
  if(raw){
    try{
      DATA = JSON.parse(raw);
    }catch(e){
      console.error('Stored planner JSON could not be parsed:', e);
      showErrorScreen('브라우저에 저장된 플래너 JSON을 해석하지 못했습니다.\n\n저장된 원본은 변경하지 않았습니다. 초기화하기 전에 원본 JSON을 내려받아 보관해 주세요.');
      return;
    }
  } else {
    DATA = baseData();
    try{
      const res = await fetch('cpa_content_v2.json');
      if(res.ok){
        const json = await res.json();
        DATA = {...DATA, ...json};
      }
    }catch(e){}
  }

  try{
    normalizeData();
  }catch(e){
    console.error('Planner initialization failed:', e);
    showErrorScreen(`${e.message}\n\n저장된 원본은 변경하지 않았습니다. 초기화하기 전에 원본 JSON을 내려받거나 더 최신 앱에서 다시 열어 주세요.`);
    return;
  }

  updateDDayPanel();

  VIEW_DATE = getLogicalDate();
  ensureDailyData(VIEW_DATE);

  updateClock();
  setInterval(updateClock, 1000);
  checkForAppUpdate();
  setInterval(() => checkForAppUpdate(), 5 * 60 * 1000);

  __lastTimerTickAt = Date.now();
  __timerCarryMs = 0;
  __timerDate = getLogicalDate();
  syncDailyTimerRunningState(__timerDate);

  window.addEventListener('hashchange', ()=> renderRouter(true));
  renderRouter();

  renderDailySidebar();

  if(ticker) clearInterval(ticker);
  ticker = setInterval(tickOneSecond, 1000);

  saveData();
}

window.addEventListener('load', ()=>{ applyMath(); });

init();
</script>
